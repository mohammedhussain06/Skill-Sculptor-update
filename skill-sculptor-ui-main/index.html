<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkillSculptor - Sculpt Your Skills, Step by Step</title>
    <meta name="description" content="Generate personalized learning roadmaps with SkillSculptor" />
    <meta name="author" content="SkillSculptor" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Apply saved theme BEFORE React renders to prevent white flash -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            // Default to dark unless user explicitly chose light
            document.documentElement.classList.add('dark');
          }
        } catch(e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <meta property="og:title" content="SkillSculptor" />
    <meta property="og:description" content="AI-powered personalized learning roadmaps" />
    <meta property="og:type" content="website" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
